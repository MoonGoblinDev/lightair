# A release: push a tag like v0.2.0 (the version in Cargo.toml) and this builds the signed,
# notarized macOS app and the Windows app, signs the update manifest Lightair's updater reads,
# and publishes them as a GitHub Release (docs/releasing.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag matches Cargo.toml's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag v$tag but Cargo.toml says $cargo_version: bump it first"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CEF_PATH: ${{ github.workspace }}/cef
      LIGHTAIR_TWITCH_CLIENT_ID: ${{ secrets.LIGHTAIR_TWITCH_CLIENT_ID }}
      LIGHTAIR_YOUTUBE_CLIENT_ID: ${{ secrets.LIGHTAIR_YOUTUBE_CLIENT_ID }}
      LIGHTAIR_YOUTUBE_CLIENT_SECRET: ${{ secrets.LIGHTAIR_YOUTUBE_CLIENT_SECRET }}
      LIGHTAIR_KICK_CLIENT_ID: ${{ secrets.LIGHTAIR_KICK_CLIENT_ID }}
      LIGHTAIR_KICK_CLIENT_SECRET: ${{ secrets.LIGHTAIR_KICK_CLIENT_SECRET }}
      LIGHTAIR_X_CLIENT_ID: ${{ secrets.LIGHTAIR_X_CLIENT_ID }}
      LIGHTAIR_X_CLIENT_SECRET: ${{ secrets.LIGHTAIR_X_CLIENT_SECRET }}
      LIGHTAIR_SPOTIFY_CLIENT_ID: ${{ secrets.LIGHTAIR_SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Chromium (CEF), outside target/ so the Rust cache can't leave half of it behind
      - name: CEF cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cef
          key: cef-156.0.28-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # libobs as Lightair is built against it: OBS 33.0.0's own app (its frameworks, plugins and
      # mux helper go into Lightair.app), plus the tools dist bundles
      - name: OBS 33.0.0 and tools
        run: |
          gh release download 33.0.0 --repo obsproject/obs-studio --pattern 'OBS-Studio-33.0.0-macOS-Apple.dmg' --dir "$RUNNER_TEMP"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/obs" "$RUNNER_TEMP/OBS-Studio-33.0.0-macOS-Apple.dmg"
          ditto "$RUNNER_TEMP/obs/OBS.app" /Applications/OBS.app
          hdiutil detach "$RUNNER_TEMP/obs"
          brew install ffmpeg whisper-cpp
        env:
          GH_TOKEN: ${{ github.token }}

      # the Developer ID certificate into a keychain of this run's own, and the notary's login
      - name: Signing and notarization
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/lightair.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          xcrun notarytool store-credentials lightair --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"

      - name: Build, sign, notarize
        env:
          LIGHTAIR_NOTARY_PROFILE: lightair
        run: cargo xtask dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/Lightair-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CEF_PATH: ${{ github.workspace }}/cef
      LIGHTAIR_TWITCH_CLIENT_ID: ${{ secrets.LIGHTAIR_TWITCH_CLIENT_ID }}
      LIGHTAIR_YOUTUBE_CLIENT_ID: ${{ secrets.LIGHTAIR_YOUTUBE_CLIENT_ID }}
      LIGHTAIR_YOUTUBE_CLIENT_SECRET: ${{ secrets.LIGHTAIR_YOUTUBE_CLIENT_SECRET }}
      LIGHTAIR_KICK_CLIENT_ID: ${{ secrets.LIGHTAIR_KICK_CLIENT_ID }}
      LIGHTAIR_KICK_CLIENT_SECRET: ${{ secrets.LIGHTAIR_KICK_CLIENT_SECRET }}
      LIGHTAIR_X_CLIENT_ID: ${{ secrets.LIGHTAIR_X_CLIENT_ID }}
      LIGHTAIR_X_CLIENT_SECRET: ${{ secrets.LIGHTAIR_X_CLIENT_SECRET }}
      LIGHTAIR_SPOTIFY_CLIENT_ID: ${{ secrets.LIGHTAIR_SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Chromium (CEF), outside target/ so the Rust cache can't leave half of it behind
      - name: CEF cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cef
          key: cef-156.0.28-${{ runner.os }}

      # libobs as OBS releases it: OBS 33.0.0's official Windows build, the version the bindings
      # come from (third_party/obs-studio, unmodified), installed on this build machine only.
      # Lightair imports obs.dll by name and bundles it; its users never need OBS.
      - name: OBS 33.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 33.0.0 --repo obsproject/obs-studio --pattern 'OBS-Studio-33.0.0-Windows-x64-Installer.exe' --dir $env:RUNNER_TEMP
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\OBS-Studio-33.0.0-Windows-x64-Installer.exe" -ArgumentList '/S', '/D=C:\obs'
          if (!(Test-Path 'C:\obs\bin\64bit\obs.dll')) { throw "OBS 33.0.0 didn't install" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Lightair Effect Stack module
        env:
          OBS_DIR: C:\obs
        run: cargo xtask modules
      - name: Build
        env:
          OBS_DIR: C:\obs
        run: cargo xtask dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/Lightair-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # the manifest the updater reads, signed with the update key
      - name: Update manifest
        env:
          LIGHTAIR_UPDATE_KEY: ${{ secrets.LIGHTAIR_UPDATE_KEY }}
        run: |
          # checkout fetches a pushed tag without its message: the tag itself, for its summary
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          echo "$notes" > "$RUNNER_TEMP/notes"
          cargo run --quiet --package xtask -- update-manifest "${{ needs.version.outputs.version }}" dist "$notes"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Lightair ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes" \
            --generate-notes \
            --verify-tag

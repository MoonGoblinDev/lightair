# Lightair builds and tests on both platforms (docs/plans/windows.md).
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CEF_PATH: ${{ github.workspace }}/cef
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Chromium (CEF), outside target/ so the Rust cache can't leave half of it behind
      - name: CEF cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cef
          key: cef-156.0.28-${{ runner.os }}

      # libobs as OBS releases it: OBS 33.0.0's official Windows build, the version the bindings
      # come from (third_party/obs-studio, unmodified), installed on this build machine only.
      # Lightair imports obs.dll by name and bundles it; its users never need OBS.
      - name: OBS 33.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 33.0.0 --repo obsproject/obs-studio --pattern 'OBS-Studio-33.0.0-Windows-x64-Installer.exe' --dir $env:RUNNER_TEMP
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\OBS-Studio-33.0.0-Windows-x64-Installer.exe" -ArgumentList '/S', '/D=C:\obs'
          if (!(Test-Path 'C:\obs\bin\64bit\obs.dll')) { throw "OBS 33.0.0 didn't install" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: ffmpeg (the recording tests read files back with ffprobe)
        run: choco install ffmpeg -y --no-progress

      - name: Clippy
        env:
          OBS_DIR: C:\obs
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Lightair Effect Stack on ONNX Runtime + DirectML (its test is skipped when it isn't built)
      - name: Lightair Effect Stack module
        env:
          OBS_DIR: C:\obs
        run: cargo xtask modules

      - name: Tests
        env:
          OBS_DIR: C:\obs
        run: cargo xtask test

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CEF_PATH: ${{ github.workspace }}/cef
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Chromium (CEF), outside target/ so the Rust cache can't leave half of it behind
      - name: CEF cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cef
          key: cef-156.0.28-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Checking needs only libobs's headers (the submodule); running needs an OBS.app, which
      # the macOS tests run against on a development Mac.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

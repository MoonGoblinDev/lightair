[package]
name = "lightair-engine"
description = "Lightair's libobs adapter: engine actor, bootstrap, module loading, telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lightair-web.workspace = true
libobs-sys.workspace = true
lightair-core.workspace = true
lightair-audio.workspace = true
uuid.workspace = true
rtrb = "0.3"
hound = "3"
serde_json.workspace = true
serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot.workspace = true
cpal = "0.18"
base64 = "0.22"
vst3 = "0.3"
lightair-platform.workspace = true
lightair-render.workspace = true

# Audio Units, and VST3 bundles loaded through CoreFoundation; AVFoundation (media_source)
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"

# VST3 modules (DLLs) on Windows
[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[dev-dependencies]
rtrb = "0.3"
hound = "3"
tracing-subscriber.workspace = true
lightair-store.workspace = true

# VST3 plugins expect the main thread: this test runs on it (no harness).
[[test]]
name = "vst3"
harness = false

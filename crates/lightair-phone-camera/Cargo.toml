[package]
name = "lightair-phone-camera"
description = "A phone as a camera layer: Lightair Live's SRT feed received and handed to libobs on this machine, and phones reached over USB (usbmuxd, AOA)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tracing.workspace = true
parking_lot.workspace = true
futures = "0.3"
srt-tokio = "0.4.4"
socket2 = "0.6"
srt-protocol = "0.4.4"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "sync"] }
serde_json.workspace = true
base64 = "0.22"
getrandom = "0.3"
# usbmuxd's messages are property lists
plist = "1.8"
# Android Open Accessory: pure Rust USB (no libusb, so nothing LGPL)
nusb = "0.2"

[dev-dependencies]
bytes = "1"
serde_json.workspace = true

[package]
name = "lightair-fonts"
description = "Fonts for every Lightair app: the Google Fonts catalogue, font references, resolving, fallback, a verified cache and the font set the renderer draws with"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha1_smol = "1"
sha2 = "0.10"
# The same fontdb cosmic-text (lightair-render) draws from.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "lightair-moc3"
version = "0.4.1"
edition = "2024"
description = "Lightair's built-in runtime for .moc3 avatar models (from Mocari, MIT; see NOTICE.md)"
license = "MIT"
publish = false

[features]
default = []
wgpu = ["dep:wgpu"]

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
png = { version = "0.18.1", features = ["zlib-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
wgpu = { version = "30.0.0", features = ["noop"], optional = true }

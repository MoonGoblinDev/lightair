[package]
name = "lightair-app"
description = "Lightair: native live-production studio (application binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lightair"
path = "src/main.rs"

[build-dependencies]
# Windows: the icon and version information in lightair.exe
embed-resource = "3"

[dependencies]
# automation triggers (triggers.rs): MIDI inputs, game controllers
midir = "0.11"
gilrs = "0.11"
lightair-engine.workspace = true
lightair-automation.workspace = true
lightair-live.workspace = true
lightair-widgets.workspace = true
getrandom = "0.3"
lightair-preview.workspace = true
lightair-web.workspace = true
lightair-core.workspace = true
lightair-audio.workspace = true
lightair-store.workspace = true
serde_json.workspace = true
lightair-platform.workspace = true
lightair-render.workspace = true
lightair-remote.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde.workspace = true
# code editors: HTML, CSS, JavaScript and JSON coloured (a widget's code, custom CSS)
gpui-kit = { workspace = true, features = ["tree-sitter-html", "tree-sitter-css", "tree-sitter-javascript"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
futures-channel = "0.3"
# The Editor player's sound.
cpal = "0.18"
rtrb = "0.3"
# Library thumbnails (PNG); elsewhere than macOS, the preview's frames as images (frame_view.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The window's native view (the preview under the UI on macOS).
raw-window-handle = "0.6"

# Plugin editor windows, the macOS camera effects panel.
[target.'cfg(target_os = "macos")'.dependencies]
# importing a sign-in from Chrome and its kin (Chrome's cookie encryption)
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }


# SQLite (the browsers' cookie stores) builds C: the Windows check run from a Mac
# (`lightair_cross_check`, xtask precommit) leaves it out, as lightair-web leaves Chromium.
[target.'cfg(all(windows, not(lightair_cross_check)))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# importing a sign-in from Chrome and its kin (their cookie store, AES-GCM under a DPAPI key)
aes-gcm = "0.10"
sha2 = "0.10"
# The preview under the UI: DirectComposition visuals in GPUI's window (its underlay, patched in
# third_party/gpui-pre-windows).
gpui-pre-windows = "=0.3.12"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    # Now playing: the system's media sessions
    "Foundation",
    "Media_Control",
    "Storage_Streams",
] }
windows-numerics = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
] }
# LIGHTAIR_STALLS: naming the stalled UI thread's frames (stall_watch.rs)
backtrace = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lightair_cross_check)'] }

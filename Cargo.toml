[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# internal
libobs-sys = { path = "crates/libobs-sys" }
lightair-engine = { path = "crates/lightair-engine" }
lightair-avatar = { path = "crates/lightair-avatar" }
# Live2D models: mocari, a pure Rust runtime (Lightair's fork, third_party/mocari).
mocari = { path = "third_party/mocari" }
lightair-preview = { path = "crates/lightair-preview" }
lightair-ui = { path = "crates/lightair-ui" }
lightair-web = { path = "crates/lightair-web" }

# external
# The crates every Lightair app shares, from lightair-core, pinned to one commit
# (`cargo xtask core-pin <rev>` moves it). To work on lightair-core and the desktop together,
# `cargo xtask core-link` builds against the checkout beside this repo (`../lightair-core`) until
# `cargo xtask core-unlink`; `cargo xtask check` refuses while it's linked.
lightair-model = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-store = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-audio = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-render = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-fonts = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-live = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-widgets = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-automation = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-remote = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }
lightair-platform = { git = "https://github.com/MoonGoblinDev/lightair-core", rev = "78e0c613da407589ae37774fdfbd435dba404d3c" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
gpui-kit = "0.9.1"

[profile.dev]
# Line tables: backtraces and stepping by line, without variables' and types' descriptions,
# which made every object several times larger and slower to write (docs/build-speed.md).
# For a session in the debugger with variables: CARGO_PROFILE_DEV_DEBUG=full cargo build.
debug = "line-tables-only"

# Dependencies (GPUI, gpui-kit) are slow when unoptimised; keep our own code debuggable. Their
# debug info isn't read: backtraces still name their functions.
[profile.dev.package."*"]
opt-level = 2
debug = false

# lightair-core's crates sit outside this workspace, so "*" above would optimise them like
# third-party code; they stay as debuggable as our own.
[profile.dev.package.lightair-model]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-store]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-audio]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-render]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-fonts]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-live]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-widgets]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-automation]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-remote]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.lightair-platform]
opt-level = 0
debug = "line-tables-only"

# gpui-component with a switch to hide the dock's "…" panel menu (third_party/gpui-component/LIGHTAIR-PATCH.md).
[patch.crates-io]
gpui-component = { path = "third_party/gpui-component" }
# gpui-base with docking beside a whole column (third_party/gpui-base/LIGHTAIR-PATCH.md).
gpui-base = { path = "third_party/gpui-base" }
# gpui-pre-windows with a composition visual under each window's UI, for the canvas preview
# (third_party/gpui-pre-windows/LIGHTAIR-PATCH.md).
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }
